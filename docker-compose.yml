services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./src:/var/www

    networks:
      - laravel

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: laravel

    ports:
      - "3306:3306"

    volumes:
      - dbdata:/var/lib/mysql

    networks:
      - laravel

networks:
  laravel:

volumes:
  dbdata: